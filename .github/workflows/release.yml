name: Release
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Require Discord release webhook
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - every release must be announced to Discord, so this run is refused before the release is created. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo ${{ github.repository }}' and re-run."
            exit 1
          }
          Write-Host "Discord release webhook is configured."

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Host "::error::Tag '$tag' is not a valid v<major>.<minor>.<patch> version"
            exit 1
          }
          $version = $Matches[1]
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Release version: $version" -ForegroundColor Green

      - name: Validate version matches manifest.json
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw manifest.json | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION) {
            Write-Host "::error::manifest.json version '$($manifest.version)' does not match tag version '$($env:VERSION)'"
            exit 1
          }
          Write-Host "manifest.json version matches tag: $($env:VERSION)" -ForegroundColor Green

      # C++ toolchain for the pixi `package` task's cmake/msbuild build.
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@v3

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6

      # Same command as build.yml and developers run - no build logic in YAML.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Generate release notes
        shell: pwsh
        run: |
          ./cameraunlock-core/scripts/generate-release-notes.ps1 `
            -Version $env:VERSION `
            -ProjectName "RE7 Head Tracking" `
            -ArtifactPaths @('src/', 'cameraunlock-core/', 'scripts/install.cmd', 'scripts/uninstall.cmd')

      - name: Find release ZIPs
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*-installer.zip | Select-Object -First 1
          $nexus = Get-ChildItem release/*-nexus.zip | Select-Object -First 1
          if (-not $installer) { Write-Host "::error::Installer ZIP not found in release/"; exit 1 }
          if (-not $nexus)     { Write-Host "::error::Nexus ZIP not found in release/"; exit 1 }
          "INSTALLER_ZIP=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NEXUS_ZIP=$($nexus.FullName)"         | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installer: $($installer.Name)" -ForegroundColor Green
          Write-Host "Nexus:     $($nexus.Name)" -ForegroundColor Green

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title "RE7 Head Tracking $env:GITHUB_REF_NAME" `
            --notes-file release-notes.txt `
            "$env:INSTALLER_ZIP" `
            "$env:NEXUS_ZIP"

      - name: Announce release to Discord
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - the release was created but not announced. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo ${{ github.repository }}' and re-run this job."
            exit 1
          }
          $tag  = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $name = (Get-Culture).TextInfo.ToTitleCase(((($repo -split '/')[-1]) -replace '-head-?tracking$','' -replace '-',' '))
          $url  = "https://github.com/$repo/releases/tag/$tag"
          $payload = @{
            username = 'Mod Releases'
            embeds   = @(@{
              title       = "$name Head Tracking $tag"
              url         = $url
              description = "A new release of **$name Head Tracking** is live.`n`n**[Download the $tag release]($url)**"
              color       = 5814783
            })
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_RELEASE_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload
          Write-Host "Announced $tag to Discord."
